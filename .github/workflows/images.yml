name: Build & push images

# Builds all six service images on native amd64/ARM runners (no more ENOSPC on the
# tiny EC2 boxes) and pushes them to Docker Hub. Hosts then just `docker compose pull`.
#
# Required repo secrets:
#   DOCKERHUB_USERNAME  e.g. pachal
#   DOCKERHUB_TOKEN     a Docker Hub access token (hub.docker.com → Account Settings
#                       → Security → New Access Token; NOT your password)
# Optional repo variable:
#   NEXT_PUBLIC_DASHBOARD_URL  baked into the marketing site (default below)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: images-main
  cancel-in-progress: false

jobs:
  release:
    # A workflow_run has access to secrets: accept only our own main push CI.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/github-script@v7
        id: gate
        with:
          script: |
            const repo = context.repo;
            const { data: branch } = await github.rest.repos.getBranch({ ...repo, branch: 'main' });
            const sha = context.payload.workflow_run?.head_sha ?? context.sha;
            if (sha !== branch.commit.sha ||
                (context.eventName === 'workflow_dispatch' && context.ref !== 'refs/heads/main')) {
              core.setFailed('Only the current main revision can be published.');
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...repo, workflow_id: 'ci.yml', head_sha: sha, event: 'push', per_page: 100,
            });
            const latest = data.workflow_runs.sort((a, b) => b.id - a.id)[0];
            if (!latest || latest.conclusion !== 'success') {
              core.setFailed('The exact release revision must pass CI, including smoke tests.');
              return;
            }
            core.setOutput('sha', sha);

  build:
    needs: release
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, marketing, developers, dashboard, admin]
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/rootmail-${{ matrix.app }}
          tags: |
            type=raw,value=sha-${{ needs.release.outputs.sha }}-${{ matrix.platform.arch }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Only the marketing Dockerfile declares this ARG; the others ignore it.
          build-args: |
            NEXT_PUBLIC_DASHBOARD_URL=${{ vars.NEXT_PUBLIC_DASHBOARD_URL || 'https://app.rootmail.io' }}
          # Layer cache only for api/worker. The Next apps (marketing/dashboard/admin)
          # build clean every time — a cached .next can yield a corrupt React client
          # manifest ("Could not find module … in the React Client Manifest") at runtime.
          cache-from: ${{ (matrix.app == 'api' || matrix.app == 'worker') && format('type=gha,scope={0}-{1}', matrix.app, matrix.platform.arch) || '' }}
          cache-to: ${{ (matrix.app == 'api' || matrix.app == 'worker') && format('type=gha,mode=max,scope={0}-{1}', matrix.app, matrix.platform.arch) || '' }}

  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, worker, marketing, developers, dashboard, admin]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish both native architectures after all builds succeed
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/rootmail-${{ matrix.app }}
          RELEASE: sha-${{ needs.release.outputs.sha }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$RELEASE" --tag "$IMAGE:latest" \
            "$IMAGE:$RELEASE-amd64" "$IMAGE:$RELEASE-arm64"
