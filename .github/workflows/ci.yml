name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Cheap and fast, so it runs before the build: a placeholder link is a
      # content bug the compiler can't see.
      - name: No placeholder links
        run: ./scripts/check-dead-links.sh
      - run: pnpm build

  e2e:
    name: e2e smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rootmail
          POSTGRES_PASSWORD: rootmail
          POSTGRES_DB: rootmail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rootmail"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://rootmail:rootmail@localhost:5432/rootmail
      REDIS_URL: redis://localhost:6379
      MAIL_PROVIDER: mock
      # Explicit, because the DEFAULT changed. This used to rely on
      # DNS_VERIFY_MODE defaulting to "mock"; when that default was flipped to
      # "live" (so a self-hoster could not silently verify nothing), CI began
      # doing real DNS lookups against a domain invented per run — and the smoke
      # test has failed at "sub-tenant verified" ever since, on every commit,
      # while the deploy workflow carried on. Never let a test depend on a
      # default it does not state.
      DNS_VERIFY_MODE: mock
      # Absolute, because CI has no .env: `rootDir` (which a relative MAILDIR is
      # resolved against) falls back to process.cwd(), and the worker runs with
      # pnpm --filter, so its cwd is apps/worker while the smoke looks at the
      # repo root. Pinning the path makes both agree.
      MAILDIR: ${{ github.workspace }}/.maildir
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate database
        run: pnpm db:migrate
      - name: Unit and isolation tests
        run: pnpm exec turbo run test --env-mode=loose
      - name: Quota and end-to-end smoke
        run: |
          pnpm --filter @rootmail/api test:quota
          SEED=$(pnpm db:seed 2>&1)
          KEY=$(printf '%s' "$SEED" | grep -oE 'rm_live_[A-Za-z0-9_-]+' | head -1)
          # The sandbox key: simulated delivery events are refused on live mail,
          # so exercising them needs the TEST key — and the smoke asserts the
          # live refusal as well, which is the half worth guarding.
          TKEY=$(printf '%s' "$SEED" | grep -oE 'rm_test_[A-Za-z0-9_-]+' | head -1)
          test -n "$KEY" || { echo "no API key from seed"; exit 1; }
          pnpm --filter @rootmail/api exec tsx src/index.ts > /tmp/api.log 2>&1 &
          pnpm --filter @rootmail/worker exec tsx src/index.ts > /tmp/worker.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4000/health >/dev/null && break; sleep 2; done
          ROOTMAIL_API_KEY="$KEY" ROOTMAIL_TEST_API_KEY="$TKEY" pnpm exec tsx scripts/smoke.ts
      - name: Service logs (on failure)
        if: failure()
        run: tail -n 80 /tmp/api.log /tmp/worker.log 2>/dev/null || true
