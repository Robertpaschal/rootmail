# Optional overlay, copied to the host root only after review. Never include the
# API's broad env file on the hook. Requires explicit --profile auth-pilot.
# Use with the normal prod + host overlays and --env-file .env.prod.
services:
  api:
    networks: [default, auth-content]
  worker:
    networks: [default, auth-content]
  auth-content-vault:
    profiles: [auth-pilot]
    image: valkey/valkey@sha256:9acdf6f0ae1771ea63c401e127054b2d1779227b9230dcfae37fa684610eaa4f
    user: "999:1000"
    command: [valkey-server, --save, "", --appendonly, "no", --maxmemory, 64mb, --maxmemory-policy, noeviction, --aclfile, /run/users.acl, --loglevel, warning]
    restart: unless-stopped
    read_only: true
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 0.25
    pids_limit: 32
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ulimits:
      core: {soft: 0, hard: 0}
    tmpfs: ["/data:size=1m,mode=0700,uid=999,gid=1000", "/tmp:size=1m"]
    volumes:
      - /etc/rootmail/auth-vault.acl:/run/users.acl:ro
    networks: [auth-content]
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: "2"}
  sprout-hook:
    profiles: [auth-pilot]
    image: ${REGISTRY:-pachal}/rootmail-api:${TAG:?Use an immutable release tag}
    working_dir: /app/apps/api
    command: [node, --import, tsx, src/cli/supabase-hook-server.ts]
    env_file: [.env.sprout-hook.prod]
    environment:
      NODE_ENV: production
      HOOK_DATABASE_CA_FILE: /run/rds-ca.pem
    ports: ["127.0.0.1:4011:4011"]
    volumes:
      - /etc/rootmail/rds-ca.pem:/run/rds-ca.pem:ro
    networks: [default]
    restart: unless-stopped
    init: true
    read_only: true
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.5
    pids_limit: 48
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ulimits:
      core: {soft: 0, hard: 0}
    tmpfs: [/tmp:size=8m]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4011/health',{signal:AbortSignal.timeout(1000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 2s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: "2"}
networks:
  auth-content:
    internal: true
